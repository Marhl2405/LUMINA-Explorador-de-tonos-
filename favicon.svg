<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Wooden palette background -->
  <defs>
    <radialGradient id="woodGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Palette shape -->
  <ellipse cx="16" cy="16" rx="14" ry="13" fill="url(#woodGradient)" stroke="#5C4033" stroke-width="1"/>
  
  <!-- Thumb hole -->
  <ellipse cx="10" cy="22" rx="3" ry="3.5" fill="#4A3728" stroke="#3C2F21" stroke-width="0.5"/>
  
  <!-- Color dots -->
  <!-- Red (primary) -->
  <circle cx="10" cy="8" r="2.5" fill="#FF0000" stroke="#8B4513" stroke-width="0.5"/>
  <!-- Blue (primary) -->
  <circle cx="16" cy="6" r="2.5" fill="#0000FF" stroke="#8B4513" stroke-width="0.5"/>
  <!-- Yellow (primary) -->
  <circle cx="22" cy="8" r="2.5" fill="#FFD700" stroke="#8B4513" stroke-width="0.5"/>
  
  <!-- White -->
  <circle cx="13" cy="14" r="2.5" fill="#FFFFFF" stroke="#8B4513" stroke-width="0.5"/>
  <!-- Black -->
  <circle cx="19" cy="14" r="2.5" fill="#000000" stroke="#8B4513" stroke-width="0.5"/>
  
  <!-- Green (secondary) -->
  <circle cx="25" cy="16" r="2.5" fill="#00AA00" stroke="#8B4513" stroke-width="0.5"/>
  
  <!-- Wood texture lines -->
  <path d="M 5 15 Q 12 13 20 16" stroke="#6B5344" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M 4 20 Q 16 22 26 19" stroke="#5C4033" stroke-width="0.5" fill="none" opacity="0.5"/>
</svg>
