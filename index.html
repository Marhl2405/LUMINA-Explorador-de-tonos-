<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA — Tone Explorer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0a0a0d;
  --panel:   #121218;
  --panel2:  #16161c;
  --border:  rgba(255,255,255,0.08);
  --text:    #f5f5f7;
  --dim:     rgba(255,255,255,0.4);
  --col:     120,80,220;
  --scan:    rgba(255,255,255,0.014);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background: #0d0d10;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:''; position:fixed; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scan) 2px,var(--scan) 4px);
  pointer-events:none; z-index:999;
}

.orb { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; transition:background 1.4s ease; opacity:0.6; }
.orb-1 { width:560px;height:560px;top:-140px;left:-120px; animation:floatA 13s ease-in-out infinite; }
.orb-2 { width:440px;height:440px;bottom:-100px;right:-100px; animation:floatB 15s ease-in-out infinite; }
.orb-3 { width:300px;height:300px;top:40%;left:55%; animation:floatA 18s ease-in-out infinite 3s; opacity:0.5; }
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,18px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,-28px)}}

.wrap { position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:26px 20px 36px; }

/* CONSOLE CARD */
.console-card{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  background:linear-gradient(160deg, #121218 0%, #0a0a0d 55%, #0a0a0d 100%);
  border:1px solid rgba(var(--col),0.35);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  transition:border-color 0.8s;
}
.card-glow{
  position:absolute;top:-60px;left:-60px;width:320px;height:320px;
  background:radial-gradient(circle, rgba(var(--col),0.4) 0%, transparent 70%);
  filter:blur(10px);pointer-events:none;transition:background 0.8s;z-index:0;
}
.card-inner{position:relative;z-index:1;padding:20px 26px 18px;}

/* HEADER */
header {
  margin-bottom:16px;
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:12px;
}
.logo-block { display:flex;align-items:baseline;gap:12px;flex-wrap:wrap; }
.logo-block h1 {
  font-family:'Manrope',sans-serif;
  font-size:22px;
  font-weight:800; letter-spacing:1px; line-height:1; color:var(--text);
}
.logo-sub { font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;font-family:'JetBrains Mono',monospace; }

.hdr-btns { display:flex;gap:10px;align-items:center;flex-wrap:wrap; }

.lang-group{ display:flex;border:1px solid rgba(255,255,255,0.12);border-radius:8px;overflow:hidden; }

.btn {
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:1px;
  padding:8px 14px;border:1px solid;cursor:pointer;transition:all 0.2s;border-radius:8px;
}
.btn-accent {
  background:rgb(var(--col));border-color:rgb(var(--col));color:#0a0a0c;
  transition:background 0.8s,border-color 0.8s,color 0.8s;
}
.btn-accent:hover{filter:brightness(1.15);transform:translateY(-1px);}
.btn-outline {
  background:rgba(var(--col),0.14);border-color:rgba(var(--col),0.35);color:rgb(var(--col));
  transition:border-color 0.8s,color 0.8s,background 0.8s;
  display:flex;align-items:center;gap:6px;
}
.btn-outline:hover{border-color:rgb(var(--col));background:rgba(var(--col),0.2);}

.lang-btn {
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  padding:7px 11px;border:none;border-left:1px solid rgba(255,255,255,0.1);
  background:transparent;color:rgba(255,255,255,0.4);cursor:pointer;transition:all 0.15s;
}
.lang-btn:first-child{border-left:none;}
.lang-btn.active{background:rgb(var(--col));color:#0a0a0c;font-weight:700;transition:background 0.8s,color 0.8s;}
.lang-btn:hover{color:#ffffff;}
.lang-btn.active:hover{color:#0a0a0c;}

/* INPUT */
.input-section {
  background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;
  padding:13px 16px;margin-bottom:12px;position:relative;overflow:hidden;
}
.input-label {
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:9px;
}
.input-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.rgb-group{display:flex;flex-direction:column;gap:5px;}
.rgb-group label{font-size:0.6rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.rgb-group input[type="number"]{
  width:64px;padding:8px 10px;background:#0a0a0d;
  border:1px solid rgba(255,255,255,0.14);border-radius:6px;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;
  outline:none;transition:border-color 0.2s;-moz-appearance:textfield;
}
.rgb-group input::-webkit-outer-spin-button,
.rgb-group input::-webkit-inner-spin-button{-webkit-appearance:none;}
.rgb-group input:focus{border-color:rgb(var(--col));}
.sep{color:rgba(255,255,255,0.25);font-size:1.1rem;}
.hex-group{display:flex;flex-direction:column;gap:5px;}
.hex-group label{font-size:0.6rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.hex-group input{
  width:110px;padding:8px 10px;background:#0a0a0d;
  border:1px solid rgba(255,255,255,0.14);border-radius:6px;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;
  outline:none;transition:border-color 0.2s;text-transform:uppercase;letter-spacing:1px;
}
.hex-group input:focus{border-color:rgb(var(--col));}
.color-picker-wrap{align-self:center;}
input[type="color"]{width:40px;height:40px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;cursor:pointer;background:none;padding:2px;}
.input-row .btn-accent{margin-left:auto;}

/* ADAPTIVE PANEL */
.adaptive-panel{
  display:none;align-items:center;gap:12px;margin-bottom:14px;
  border:1px solid rgba(var(--col),0.35);border-radius:10px;overflow:hidden;
  background:rgba(var(--col),0.14);padding:12px 16px;
  transition:border-color 0.8s,background 0.8s;
}
.adapt-swatch{width:40px;height:40px;flex-shrink:0;border-radius:9px;position:relative;transition:background 0.8s,box-shadow 0.8s;border:1px solid rgba(255,255,255,0.2);}
.adapt-swatch-inner{position:absolute;inset:auto -6px -6px auto;}
.adapt-codes{
  flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0;
}
.code-row{display:flex;align-items:center;gap:10px;}
.code-tag{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;min-width:30px;}
.code-val{
  font-family:'JetBrains Mono',monospace;font-size:0.95rem;color:var(--text);cursor:pointer;font-weight:700;
  border-bottom:1px dashed rgba(255,255,255,0.15);padding-bottom:1px;
  transition:color 0.15s,border-color 0.15s;
}
.code-val:hover{color:rgb(var(--col));border-color:rgb(var(--col));}
.adapt-hsl{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:rgba(255,255,255,0.55);letter-spacing:0.3px;}
.comp-badge{display:inline-flex;align-items:center;gap:6px;font-size:0.65rem;letter-spacing:1.5px;color:var(--dim);}
.comp-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #0a0a0d;flex-shrink:0;transition:background 0.8s;}
.comp-badge-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.25);transition:background 0.4s;}
.comp-hex{font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.5px;color:var(--text);cursor:pointer;border-bottom:1px dashed rgba(255,255,255,0.15);transition:color 0.15s,border-color 0.15s;}
.comp-hex:hover{color:rgb(var(--col));border-color:rgb(var(--col));}

/* SECTION TITLE */
.section-title{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
  margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.section-title::before{content:'//';color:rgb(var(--col));transition:color 0.8s;}

/* SCALE */
.scale-wrap{display:none;margin-bottom:14px;}
.scale-bar{display:flex;height:18px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;margin-bottom:5px;}
.scale-seg{flex:1;cursor:pointer;transition:flex 0.25s;}
.scale-seg:hover{flex:2.5;}
.scale-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:1px;padding:0 2px;text-transform:uppercase;}

/* TONES LAYOUT */
.tones-wrap{display:none;margin-bottom:16px;}
.tones-inner{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.sidebar-col{flex:none;width:250px;}
.palette-col{flex:1;min-width:280px;}

/* SPHERE */
.sphere-box{
  width:250px;height:250px;border-radius:14px;background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:pointer;
}
.sphere-orb{
  width:224px;height:224px;border-radius:50%;
  box-shadow:0 30px 50px -10px rgba(var(--col),0.5), inset -14px -14px 30px rgba(0,0,0,0.55);
  transition:background 0.25s ease,box-shadow 0.8s ease;
}

/* TONE GRID */
.tone-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.tone-card{position:relative;cursor:pointer;overflow:visible;border-radius:10px;border:1px solid var(--border);background:var(--panel2);transition:border-color 0.2s,transform 0.2s;}
.tone-card:hover{transform:translateY(-3px);border-color:rgba(var(--col),0.5);}
.tone-swatch{height:78px;border-radius:9px 9px 0 0;position:relative;overflow:hidden;}
.swatch-hsl-badge{
  position:absolute;bottom:6px;right:7px;
  font-size:0.56rem;font-family:'JetBrains Mono',monospace;
  letter-spacing:0.4px;opacity:0.65;line-height:1.3;text-align:right;
}
.tone-info{background:var(--panel2);padding:7px 9px 9px;border-radius:0 0 9px 9px;}
.tone-role{
  font-family:'Manrope',sans-serif;font-size:0.67rem;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:4px;transition:color 0.8s;
}
.tone-hex{font-family:'JetBrains Mono',monospace;font-size:0.83rem;color:#f5f5f7;margin-bottom:2px;}
.tone-rgb{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#7a7090;}
.tone-hsl{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#7a7090;margin-top:1px;}
.tone-hex:hover,.tone-rgb:hover,.tone-hsl:hover{color:rgb(var(--col));}

/* TOOLTIP */
.tone-tooltip{
  display:none;position:absolute;
  bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  width:256px;background:#13111e;border:1px solid rgb(var(--col));border-radius:10px;
  padding:14px 15px;z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,0.7),0 0 24px rgba(var(--col),0.15);
  pointer-events:none;transition:border-color 0.8s;
}
.tone-card:hover .tone-tooltip{display:block;animation:popUp 0.16s ease;}
@keyframes popUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.tone-tooltip::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:rgb(var(--col));transition:border-top-color 0.8s;
}
.tt-theory{
  font-size:0.66rem;color:#9888c0;line-height:1.45;
  margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border);font-style:italic;
}
.tt-title{
  font-family:'Manrope',sans-serif;font-size:0.7rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:rgb(var(--col));margin-bottom:8px;transition:color 0.8s;
}
.tt-actions{list-style:none;display:flex;flex-direction:column;gap:4px;}
.tt-actions li{font-size:0.7rem;color:#c0b8d8;line-height:1.4;display:flex;gap:6px;align-items:flex-start;}
.tt-actions li::before{content:'→';color:rgb(var(--col));flex-shrink:0;transition:color 0.8s;}

/* HISTORY */
.history-wrap{margin-top:14px;}
.history-toggle{cursor:pointer;user-select:none;justify-content:space-between;transition:color 0.15s;}
.history-toggle:hover{color:var(--text);}
.history-chevron{margin-left:auto;font-size:11px;line-height:1;transition:transform 0.25s ease;}
.history-chevron.open{transform:rotate(180deg);}
.history-grid{display:none;flex-direction:column;gap:5px;max-height:220px;overflow:auto;margin-top:2px;}
.history-grid.open{display:flex;}
.history-item{
  border:1px solid var(--border);border-radius:8px;cursor:pointer;overflow:hidden;
  transition:border-color 0.2s,transform 0.2s;
}
.history-item:hover{border-color:rgb(var(--col));transform:translateY(-2px);}
.history-strip{display:flex;height:28px;}
.history-seg{flex:1;}
.history-meta{
  padding:6px 9px;background:var(--panel2);
  display:flex;justify-content:space-between;align-items:center;
}
.history-hex{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text);}
.history-arrow{font-size:0.85rem;transition:color 0.8s;}

/* TOAST */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgb(var(--col));color:#0a0a0c;
  font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:700;
  letter-spacing:1.5px;padding:9px 22px;border-radius:8px;
  opacity:0;transition:all 0.3s;pointer-events:none;z-index:1000;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.footer{text-align:center;margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--dim);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.footer-link{display:inline-flex;align-items:center;justify-content:center;color:var(--dim);transition:all 0.2s;cursor:pointer;text-decoration:none;}
.footer-link:hover{color:rgb(var(--col));}
.footer-link svg{width:22px;height:22px;stroke-width:2;}

@media (max-width:720px){
  .card-inner{padding:18px 16px 20px;}
  .sidebar-col{width:100%;}
  .tones-inner{flex-direction:column;}
}
</style>
</head>

<div class="card-inner">

  <header>
    <div class="logo-block">
      <h1>LUMINA</h1>
      <span class="logo-sub" id="logoSub">// Explorador de tonos · luces · sombras</span>

    <div class="hdr-btns">
      <div class="lang-group">

<script>
// ══ COLOR MATH ══
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}
  else{
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){
      case r:h=((g-b)/d+(g<b?6:0))/6;break;
      case g:h=((b-r)/d+2)/6;break;
      case b:h=((r-g)/d+4)/6;break;
    }
  }
  return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}

function hslToRgb(h,s,l){
  h=((h%360)+360)%360;s/=100;l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};
  return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}

function rgbToHex(r,g,b){
  return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('').toUpperCase();
}

function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}

function lerpHue(h1,h2,t){
  let d=h2-h1;if(d>180)d-=360;if(d<-180)d+=360;
  return((h1+d*t)%360+360)%360;
}

function contrastColor(r,g,b){
  return(0.299*r+0.587*g+0.114*b)/255>0.5?'#0a0a0c':'#f0ecff';
}

// ══ ADVANCED COLOR THEORY ENGINE ══
// Classic color-wheel split: warm = red→orange→yellow→magenta (h<90 or h>=270),
// cool = yellow-green→green→blue→violet (90<=h<270). Every hue falls on one side,
// so light/shadow hue-shift direction is always well-defined for any base color.
function isWarmHue(h){
  return h<90||h>=270;
}
function getAdaptiveHueShift(h,s,l,context){
  const isWarm=isWarmHue(h);
  const comp=(h+180)%360;
  const lightH=isWarm?(h+25)%360:(h-25+360)%360;
  const shadowH=isWarm?(comp+15)%360:(comp-15+360)%360;

  switch(context){
    case 'pure-white': return lightH;
    case 'bright': return lightH;
    case 'light': return lightH;
    case 'midlight': return h;
    case 'midshadow': return h;
    case 'shadow': return shadowH;
    case 'deep-shadow': return shadowH;
    case 'core-shadow': return comp;
    default: return h;
  }
}
function getAdaptiveSaturation(h,s,l,context){
  if(s<15){
    if(context==='pure-white'||context==='bright')return 1.05;
    return 0.98;
  }
  if(context==='pure-white')return 0.75;
  if(context==='bright')return 0.85;
  if(context==='light')return 0.90;
  if(context==='midlight')return 0.92;
  if(context==='midshadow')return 0.95;
  if(context==='shadow')return 0.88;
  if(context==='deep-shadow')return 0.75;
  if(context==='core-shadow')return 0.60;
  return 1.0;
}
function getAdaptiveLuminosity(h,s,l,context){
  if(context==='pure-white')return 95;
  if(context==='bright')return Math.min(l+32,88);
  if(context==='light')return Math.min(l+20,80);
  if(context==='midlight')return Math.min(l+10,72);
  if(context==='midshadow')return Math.max(l-12,25);
  if(context==='shadow')return Math.max(l-28,15);
  if(context==='deep-shadow')return Math.max(l-42,8);
  if(context==='core-shadow')return Math.max(l-52,4);
  return l;
}
function getHBlend(context,s){
  const blendMap={
    'pure-white':0.05,'bright':0.10,'light':0.22,
    'midlight':0.10,'midshadow':0.08,'shadow':0.15,
    'deep-shadow':0.25,'core-shadow':0.35
  };
  return blendMap[context]||0;
}
function chromaTone(h,s,l,{hShift=0,sMult=1,lTarget,hBlend=0}){
  const nh=Math.round((lerpHue(h,hShift,hBlend)+360)%360);
  return hslToRgb(nh,Math.round(clamp(s*sMult,0,100)),Math.round(clamp(lTarget,0,100)));
}
function buildPalette(h,s,l){
  const comp=(h+180)%360;
  const Lx=I18N[currentLang];
  const tones=['pure-white','bright','light','midlight','base','midshadow','shadow','deep-shadow','core-shadow'];
  const baseIdx=tones.indexOf('base');

  const defs=tones.map((tone,i)=>{
    let hShift=h,sMult=1.0,lTarget=l,hBlend=0;
    if(tone!=='base'){
      hShift=getAdaptiveHueShift(h,s,l,tone);
      sMult=getAdaptiveSaturation(h,s,l,tone);
      lTarget=getAdaptiveLuminosity(h,s,l,tone);
      hBlend=getHBlend(tone,s);
    }
    return{
      id:tone,role:Lx.roles[i],theory:Lx.theories[i].replace('{a}',Math.round(hShift)),
      rgb:tone==='base'?hslToRgb(h,s,l):chromaTone(h,s,l,{hShift,sMult,lTarget,hBlend}),
      actions:Lx.actions[i]
    };
  });

  // Guarantee every swatch in the palette is a visually distinct color
  const seen=new Set();
  defs.forEach((def,i)=>{
    let hex=rgbToHex(def.rgb[0],def.rgb[1],def.rgb[2]);
    if(!seen.has(hex)){seen.add(hex);return;}
    const[dh,ds,dl]=rgbToHsl(def.rgb[0],def.rgb[1],def.rgb[2]);
    const dir=i<baseIdx?1:-1;
    let nl=dl,guard=0;
    do{
      nl=clamp(nl+dir*2,2,98);
      def.rgb=hslToRgb(dh,ds,nl);
      hex=rgbToHex(def.rgb[0],def.rgb[1],def.rgb[2]);
      guard++;
    }while(seen.has(hex)&&guard<40);
    seen.add(hex);
  });

  return defs;
}

// ══ SYNC INPUTS ══
function syncFromRgb(){
  const r=clamp(parseInt(document.getElementById('inR').value)||0,0,255);
  const g=clamp(parseInt(document.getElementById('inG').value)||0,0,255);
  const b=clamp(parseInt(document.getElementById('inB').value)||0,0,255);
  const hex=rgbToHex(r,g,b);
  document.getElementById('inHex').value=hex;
  document.getElementById('colorPicker').value=hex;
}
function syncFromHex(){
  const hex=document.getElementById('inHex').value;
  // Accept both 6-digit and 3-digit shorthand hex (#F00 → #FF0000)
  if(!/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(hex))return;
  const full=hex.startsWith('#')?hex:'#'+hex;
  const[r,g,b]=hexToRgb(full);
  document.getElementById('inR').value=r;
  document.getElementById('inG').value=g;
  document.getElementById('inB').value=b;
  document.getElementById('colorPicker').value=full;
}
function syncFromPicker(){
  const hex=document.getElementById('colorPicker').value;
  const[r,g,b]=hexToRgb(hex);
  document.getElementById('inR').value=r;
  document.getElementById('inG').value=g;
  document.getElementById('inB').value=b;
  document.getElementById('inHex').value=hex.toUpperCase();
}

// ══ ADAPTIVE THEME ══
function applyTheme(r,g,b,h,s,l){
  const comp=(h+180)%360;
  const[cr,cg,cb]=hslToRgb(comp,s,l);
  document.documentElement.style.setProperty('--col',`${r},${g},${b}`);
  document.getElementById('orb1').style.background=`rgba(${r},${g},${b},0.09)`;
  document.getElementById('orb2').style.background=`rgba(${cr},${cg},${cb},0.06)`;
  document.getElementById('orb3').style.background=`rgba(${r},${g},${b},0.04)`;
  document.getElementById('compDot').style.background=`rgb(${cr},${cg},${cb})`;
}

let history=[];
let currentHex=null;
let currentPaletteData=null;

function saveHistory(hex,palette){
  // Deduplicate: if this color is already in the history (even restored from
  // an older entry), remove it first so it moves to the front instead of
  // creating a duplicate row.
  const existing=history.findIndex(it=>it.hex===hex);
  if(existing!==-1)history.splice(existing,1);
  history.unshift({hex,palette:[...palette]});
  if(history.length>16)history.pop();
  renderHistory();
  document.getElementById('historyWrap').style.display='block';
}

let historyOpen=false;
function toggleHistory(){
  historyOpen=!historyOpen;
  document.getElementById('historyGrid').classList.toggle('open',historyOpen);
  document.getElementById('historyChevron').classList.toggle('open',historyOpen);
}

function renderHistory(){
  const grid=document.getElementById('historyGrid');
  if(!history.length){
    grid.innerHTML=`<div style="color:var(--dim);font-size:0.75rem;letter-spacing:2px;padding:20px 0">${Lx().emptyHistory}</div>`;
    return;
  }
  const[br,bg,bb]=hexToRgb(currentHex||'#7850DC');
  grid.innerHTML=history.map((item,i)=>{
    const strips=item.palette.map(def=>{
      const[r,g,b]=def.rgb;return`<div class="history-seg" style="background:rgb(${r},${g},${b})"></div>`;
    }).join('');
    return`<div class="history-item" onclick="loadHistory(${i})">
      <div class="history-strip">${strips}</div>
      <div class="history-meta">
        <span class="history-hex">${item.hex}</span>
        <span class="history-arrow" style="color:rgb(${br},${bg},${bb})">→</span>
      </div>
    </div>`;
  }).join('');
}

function loadHistory(i){
  const item=history[i];
  const[r,g,b]=hexToRgb(item.hex);
  document.getElementById('inR').value=r;
  document.getElementById('inG').value=g;
  document.getElementById('inB').value=b;
  document.getElementById('inHex').value=item.hex;
  document.getElementById('colorPicker').value=item.hex;
  generate();
}

// ══ GENERATE ══
function generate(){
  const r=clamp(parseInt(document.getElementById('inR').value)||0,0,255);
  const g=clamp(parseInt(document.getElementById('inG').value)||0,0,255);
  const b=clamp(parseInt(document.getElementById('inB').value)||0,0,255);
  const[h,s,l]=rgbToHsl(r,g,b);
  const hex=rgbToHex(r,g,b);
  const comp=(h+180)%360;
  currentHex=hex;

  // Reflect the canonical color back into the inputs (e.g. #F00 → #FF0000)
  document.getElementById('inHex').value=hex;
  document.getElementById('colorPicker').value=hex;

  applyTheme(r,g,b,h,s,l);

  // Base panel
  const swatch=document.getElementById('adaptSwatch');
  swatch.style.background=hex;
  swatch.style.boxShadow=`0 0 60px rgba(${r},${g},${b},0.4),0 0 120px rgba(${r},${g},${b},0.12)`;
  document.getElementById('adaptHsl').textContent=`hsl(${h}°, ${s}%, ${l}%) · ${Lx().compLabel}: ${Math.round(comp)}°`;

  // Complementary chip: give the "Complementary" label its own color swatch + hex
  // so it's clearly a distinct color from the base swatch.
  const[compR,compG,compB]=hslToRgb(comp,s,l);
  const compHexVal=rgbToHex(compR,compG,compB);
  document.getElementById('compBadgeDot').style.background=`rgb(${compR},${compG},${compB})`;
  const elCompHex=document.getElementById('compHex');
  elCompHex.textContent=compHexVal;
  elCompHex.onclick=()=>copyText(compHexVal.replace('#',''));

  const hexVal   = hex;
  const rgbVal   = `rgb(${r}, ${g}, ${b})`;
  const hslVal   = `hsl(${h}°, ${s}%, ${l}%)`;

  const elHex=document.getElementById('cHex');
  const elRgb=document.getElementById('cRgb');
  const elHsl=document.getElementById('cHsl');
  elHex.textContent=hexVal;   elHex.onclick=()=>copyText(hexVal.replace('#',''));
  elRgb.textContent=rgbVal;   elRgb.onclick=()=>copyText(rgbVal);
  elHsl.textContent=hslVal;   elHsl.onclick=()=>copyText(hslVal);
  document.getElementById('adaptPanel').style.display='flex';

  // Scale bar
  const scaleBar=document.getElementById('scaleBar');
  scaleBar.innerHTML='';
  for(let i=0;i<=28;i++){
    const pct=i/28;
    const sl2=Math.round(4+pct*92);
    const hB=pct<0.5?(1-pct*2)*0.15:(pct-0.5)*2*0.32;
    const hD=pct<0.5?comp:(h+20)%360;
    const sh2=lerpHue(h,hD,hB);
    const ss2=pct<0.5?Math.min(s*1.1,100):s*(0.5+pct*0.5);
    const[sr,sg,sb]=hslToRgb(sh2,ss2,sl2);
    const seg=document.createElement('div');
    seg.className='scale-seg';
    seg.style.background=`rgb(${sr},${sg},${sb})`;
    seg.title=`L=${sl2}° H=${Math.round(sh2)}°`;
    seg.onclick=()=>copyText(rgbToHex(sr,sg,sb).replace('#',''));
    scaleBar.appendChild(seg);
  }
  document.getElementById('scaleWrap').style.display='block';

  // Tone cards
  const palette=buildPalette(h,s,l);
  currentPaletteData={hex,h,s,l,r,g,b,palette};
  renderSphere(palette);
  setupSphereInteraction();
  const grid=document.getElementById('toneGrid');
  grid.innerHTML='';

  // Use a legible accent — if base color is very dark, use a lighter tint of it
  const [,, baseLum]=rgbToHsl(r,g,b);
  const roleColor = baseLum < 28
    ? `hsl(${h},${Math.min(s,80)}%,65%)`   // lift to visible lightness
    : `rgb(${r},${g},${b})`;

  palette.forEach(def=>{
    const[tr,tg,tb]=def.rgb;
    // Capture copies of the exact values for this iteration in const
    const copyHex = rgbToHex(tr,tg,tb);
    const copyRgb = `rgb(${tr}, ${tg}, ${tb})`;
    const[th,ts,tl]=rgbToHsl(tr,tg,tb);
    const copyHsl = `hsl(${Math.round(th)}, ${Math.round(ts)}%, ${Math.round(tl)}%)`;
    const badgeTxt=contrastColor(tr,tg,tb);
    const isBase=def.id==='base';

    // ── card container ──
    const card=document.createElement('div');
    card.className='tone-card';
    if(isBase){card.style.outline=`2px solid ${roleColor}`;card.style.outlineOffset='-2px';card.style.zIndex='2';}

    // ── tooltip ──
    const tooltip=document.createElement('div');
    tooltip.className='tone-tooltip';
    const ttTitle=document.createElement('div');ttTitle.className='tt-title';ttTitle.textContent=Lx().ttTitle;
    const ttTheory=document.createElement('div');ttTheory.className='tt-theory';ttTheory.textContent=def.theory;
    const ttList=document.createElement('ul');ttList.className='tt-actions';
    def.actions.forEach(a=>{const li=document.createElement('li');li.textContent=a;ttList.appendChild(li);});
    tooltip.appendChild(ttTitle);tooltip.appendChild(ttTheory);tooltip.appendChild(ttList);
    card.appendChild(tooltip);

    // ── swatch ──
    const swatchEl=document.createElement('div');
    swatchEl.className='tone-swatch';
    swatchEl.style.background=copyHex;
    const badge=document.createElement('div');
    badge.className='swatch-hsl-badge';
    badge.style.color=badgeTxt;
    badge.textContent=`H${Math.round(th)}° S${Math.round(ts)}% L${Math.round(tl)}%`;
    swatchEl.appendChild(badge);
    swatchEl.addEventListener('click', function(e){
      e.stopPropagation();
      copyText(copyHex.replace('#',''));
    });
    card.appendChild(swatchEl);

    // ── info panel ──
    const infoEl=document.createElement('div');
    infoEl.className='tone-info';

    const roleEl=document.createElement('div');roleEl.className='tone-role';
    roleEl.style.color=roleColor;roleEl.textContent=def.role;

    const hexEl=document.createElement('div');hexEl.className='tone-hex';
    hexEl.style.cursor='pointer';hexEl.textContent=copyHex;
    hexEl.addEventListener('click', function(e){
      e.stopPropagation();
      copyText(copyHex.replace('#',''));
    });

    const rgbEl=document.createElement('div');rgbEl.className='tone-rgb';
    rgbEl.style.cursor='pointer';rgbEl.textContent=copyRgb;
    rgbEl.addEventListener('click', function(e){
      e.stopPropagation();
      copyText(copyRgb);
    });

    const hslEl=document.createElement('div');hslEl.className='tone-hsl';
    hslEl.style.cursor='pointer';hslEl.textContent=copyHsl;
    hslEl.addEventListener('click', function(e){
      e.stopPropagation();
      copyText(copyHsl);
    });

    infoEl.appendChild(roleEl);infoEl.appendChild(hexEl);infoEl.appendChild(rgbEl);infoEl.appendChild(hslEl);
    card.appendChild(infoEl);
    grid.appendChild(card);
  });

  document.getElementById('tonesWrap').style.display='block';
  document.getElementById('btnPng').style.display='';
  saveHistory(hex,palette);
  setTimeout(()=>document.getElementById('adaptPanel').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

// ══ DOWNLOAD PNG ══
function downloadPNG(){
  if(!currentPaletteData)return;
  const{hex,h,s,l,r:br,g:bg,b:bb,palette}=currentPaletteData;
  const comp=(h+180)%360;
  const N=palette.length;
  const PAD=48,CELL_W=200,SWATCH_H=220,INFO_H=92;
  const HEADER_H=198,FOOTER_H=44;
  const W=PAD*2+N*CELL_W;
  const H=HEADER_H+(SWATCH_H+INFO_H)+PAD+FOOTER_H;

  const cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const cx=cv.getContext('2d');

  // BG
  cx.fillStyle='#0a0a0c';cx.fillRect(0,0,W,H);

  // Grid
  const gs=44;
  for(let x=0;x<=W;x+=gs){const c=palette[Math.floor(x/gs)%N];const[pr,pg,pb]=c.rgb;cx.strokeStyle=`rgba(${pr},${pg},${pb},0.09)`;cx.lineWidth=1;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
  for(let y=0;y<=H;y+=gs){const c=palette[Math.floor(y/gs)%N];const[pr,pg,pb]=c.rgb;cx.strokeStyle=`rgba(${pr},${pg},${pb},0.09)`;cx.lineWidth=1;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}

  // Scanlines
  for(let y=0;y<H;y+=4){cx.fillStyle='rgba(255,255,255,0.014)';cx.fillRect(0,y+2,W,2);}

  // Logo
  cx.textAlign='left';
  cx.font='bold 48px "Courier New",monospace';
  cx.fillStyle=`rgb(${br},${bg},${bb})`;
  cx.shadowColor=`rgba(${br},${bg},${bb},0.7)`;cx.shadowBlur=18;
  cx.fillText('LUMINA',PAD,58);cx.shadowBlur=0;

  // Accent line
  cx.strokeStyle=`rgb(${br},${bg},${bb})`;cx.lineWidth=2;
  cx.shadowColor=`rgba(${br},${bg},${bb},0.9)`;cx.shadowBlur=10;
  cx.beginPath();cx.moveTo(PAD,68);cx.lineTo(PAD+320,68);cx.stroke();cx.shadowBlur=0;

  // Base info
  cx.font='15px "Courier New",monospace';
  cx.fillStyle=`rgba(${br},${bg},${bb},0.85)`;
  cx.fillText(`BASE: ${hex}   RGB: ${br},${bg},${bb}   HSL: ${h}°,${s}%,${l}%`,PAD,98);

  cx.font='11px "Courier New",monospace';
  cx.fillStyle='#5a5470';
  cx.fillText(`${Lx().compLabel.toUpperCase()}: ${Math.round(comp)}°  ·  LUMINA TONE EXPLORER`,PAD,120);

  // Divider
  cx.strokeStyle='#222230';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(PAD,138);cx.lineTo(W-PAD,138);cx.stroke();

  // Chromatic scale bar
  const SBW=W-PAD*2,SBH=18,SBY=148;
  for(let i=0;i<=50;i++){
    const pct=i/50,sl2=Math.round(4+pct*92);
    const hB=pct<0.5?(1-pct*2)*0.15:(pct-0.5)*2*0.32;
    const hD=pct<0.5?comp:(h+20)%360;
    const sh2=lerpHue(h,hD,hB);
    const ss2=pct<0.5?Math.min(s*1.1,100):s*(0.5+pct*0.5);
    const[sr,sg,sb]=hslToRgb(sh2,ss2,sl2);
    cx.fillStyle=`rgb(${sr},${sg},${sb})`;
    cx.fillRect(PAD+Math.floor(i*(SBW/50)),SBY,Math.ceil(SBW/50)+1,SBH);
  }
  cx.strokeStyle='rgba(255,255,255,0.05)';cx.lineWidth=1;cx.strokeRect(PAD,SBY,SBW,SBH);

  // Swatches
  palette.forEach((def,i)=>{
    const[tr,tg,tb]=def.rgb;
    const thex=rgbToHex(tr,tg,tb);
    const[th2,ts2,tl2]=rgbToHsl(tr,tg,tb);
    const x=PAD+i*CELL_W;
    const y=HEADER_H;
    const txtC=contrastColor(tr,tg,tb);

    cx.fillStyle=thex;cx.fillRect(x,y,CELL_W,SWATCH_H);

    // HSL badge
    cx.fillStyle=txtC==='#0a0a0c'?'rgba(0,0,0,0.5)':'rgba(255,255,255,0.5)';
    cx.font='9px "Courier New",monospace';cx.textAlign='right';
    cx.fillText(`H${Math.round(th2)}° S${Math.round(ts2)}% L${Math.round(tl2)}%`,x+CELL_W-8,y+SWATCH_H-10);

    if(def.id==='base'){
      cx.strokeStyle=`rgb(${br},${bg},${bb})`;cx.lineWidth=3;
      cx.strokeRect(x+1,y+1,CELL_W-2,SWATCH_H-2);
    }

    cx.fillStyle='#111115';cx.fillRect(x,y+SWATCH_H,CELL_W,INFO_H);
    cx.strokeStyle='rgba(255,255,255,0.05)';cx.lineWidth=1;
    cx.strokeRect(x,y,CELL_W,SWATCH_H+INFO_H);

    const tx=x+CELL_W/2;cx.textAlign='center';
    cx.font='bold 10px "Courier New",monospace';cx.fillStyle=`rgb(${br},${bg},${bb})`;
    cx.fillText(def.role.toUpperCase(),tx,y+SWATCH_H+18);
    cx.font='bold 14px "Courier New",monospace';cx.fillStyle='#e8e4f0';
    cx.fillText(thex,tx,y+SWATCH_H+38);
    cx.font='10px "Courier New",monospace';cx.fillStyle='#7a7090';
    cx.fillText(`rgb(${tr}, ${tg}, ${tb})`,tx,y+SWATCH_H+56);
    cx.fillStyle='#55506a';
    cx.fillText(`hsl(${Math.round(th2)}°, ${Math.round(ts2)}%, ${Math.round(tl2)}%)`,tx,y+SWATCH_H+74);
  });

  cx.textAlign='center';cx.font='10px "Courier New",monospace';cx.fillStyle='#2a2538';
  cx.fillText('LUMINA · TONE EXPLORER · Color Theory Engine',W/2,H-14);

  const link=document.createElement('a');
  link.download=`lumina_${hex.replace('#','')}.png`;
  link.href=cv.toDataURL('image/png');
  document.body.appendChild(link);link.click();document.body.removeChild(link);

  showToast(Lx().pngDl);
}

// ══ 3D SPHERE (radial gradient) ══
let sphereHoverX=0,sphereHoverY=0;
let sphereLocked=false;
let sphereInteractionSetup=false;

function sphereGradient(palette,hoverX,hoverY){
  // Every stop comes straight from the adaptive color-theory palette
  // (pure-white → bright → light → midlight → base → midshadow → shadow → deep-shadow → core-shadow),
  // so the light/shadow hue shift always follows the base color's warm/cool theory.
  const stops=palette.map((def,i)=>{
    const[tr,tg,tb]=def.rgb;
    const pct=(i/(palette.length-1))*100;
    return`${rgbToHex(tr,tg,tb)} ${pct.toFixed(1)}%`;
  }).join(', ');
  return `radial-gradient(circle at ${50+hoverX}% ${34+hoverY}%, ${stops})`;
}

function renderSphere(palette){
  const orb=document.getElementById('sphereOrb');
  if(!orb)return;
  orb.style.background=sphereGradient(palette,sphereHoverX,sphereHoverY);
}

function setupSphereInteraction(){
  if(sphereInteractionSetup)return;
  sphereInteractionSetup=true;

  const box=document.getElementById('sphereBox');
  if(!box)return;

  box.addEventListener('mousemove',(e)=>{
    if(sphereLocked)return;
    const rect=box.getBoundingClientRect();
    sphereHoverX=((e.clientX-rect.left)/rect.width-0.5)*55;
    sphereHoverY=((e.clientY-rect.top)/rect.height-0.5)*55;
    if(currentPaletteData){
      renderSphere(currentPaletteData.palette);
    }
  });

  box.addEventListener('mouseleave',()=>{
    if(sphereLocked)return;
    sphereHoverX=0;sphereHoverY=0;
    if(currentPaletteData){
      renderSphere(currentPaletteData.palette);
    }
  });

  box.addEventListener('click',()=>{
    sphereLocked=!sphereLocked;
    box.style.cursor=sphereLocked?'pointer':'move';
  });

  box.style.cursor='move';
  box.title='Clic para fijar / mover la luz';
}

// ══ UTILS ══
function copyText(text){
  // Method 1: modern clipboard API
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast(text+' — '+Lx().copied);
    }).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0,99999);
  try{
    document.execCommand('copy');
    showToast(text+' — '+Lx().copied);
  }catch(e){
    showToast('Error al copiar');
  }
  document.body.removeChild(ta);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1900);
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Enter')generate();
});

// Restore the previously selected language (persisted across sessions)
(function restoreLang(){
  let saved=null;
  try{saved=localStorage.getItem('lumina_lang');}catch(e){}
  if(saved&&I18N[saved]){
    currentLang=saved;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===saved));
  }
})();
applyLangUI();
generate();
